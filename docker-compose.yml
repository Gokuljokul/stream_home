services:
  stream:
    image: gokulsouthern/stream_home:latest
    build: .
    ports:
      - "5001:5001"
    environment:
      RTSP_URL: ${RTSP_URL:-rtsp://mediamtx:8554/cam}
      PUBLISH_URL: rtsp://mediamtx:8554/cam
      PUBLISH_TOKEN: ${PUBLISH_TOKEN:-}
      VIDEO_CODEC: ${VIDEO_CODEC:-libx264}
    depends_on: [mediamtx]
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"

  # Test pattern + 440 Hz tone on /test: docker compose --profile demo up, with RTSP_URL=rtsp://mediamtx:8554/test
  test-source:
    image: linuxserver/ffmpeg:latest
    profiles: ["demo"]
    depends_on: [mediamtx]
    restart: unless-stopped
    command: >
      -re -f lavfi -i testsrc2=size=1280x720:rate=25
      -re -f lavfi -i sine=frequency=440:sample_rate=44100
      -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p
      -c:a aac -b:a 128k
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/test
