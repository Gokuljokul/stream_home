# On the Ubuntu device with the camera + mic attached:
#   v4l2-ctl --list-devices     (camera, e.g. /dev/video0)
#   arecord -l                  (mic, e.g. "card 1, device 0" -> plughw:1,0)
#   docker compose -f docker-compose.remote.yml up -d
# Viewer: http://<device-or-forwarded-host>:5001
services:
  stream:
    image: gokulsouthern/stream_home:latest
    pull_policy: always
    ports:
      - "5001:5001"
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/media0:/dev/media0
      - /dev/snd:/dev/snd
    group_add:
      - video
      - audio
    environment:
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/dev/video0}
      CAMERA_FORMAT: ${CAMERA_FORMAT:-mjpeg}
      CAMERA_SIZE: ${CAMERA_SIZE:-1280x720}
      CAMERA_FPS: ${CAMERA_FPS:-30}
      AUDIO_DEVICE: ${AUDIO_DEVICE:-plughw:1,0}
      RTSP_URL: rtsp://mediamtx:8554/cam
      PUBLISH_URL: rtsp://mediamtx:8554/cam
    depends_on: [mediamtx]
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    pull_policy: always
    ports:
      - "8554:8554"
    restart: unless-stopped
